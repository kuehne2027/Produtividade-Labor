<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Labor x Produtividade — Operação Meli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="app-css">
:root{
  --navy:#0f2a44;--navy2:#1f4e78;--gold:#c8961e;--gold2:#f2c14e;--bg:#eef2f7;--card:#fff;--ink:#14213d;--mute:#64748b;
  --line:#e2e8f0;--in:#fff8dc;--inb:#2563eb;--ok:#15803d;--bad:#b91c1c;--etq:#2f6fb0;--pes:#3f7d3a;--sor:#b07d12;--ns:#6d3fb0;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;padding:18px 22px 0;position:sticky;top:0;z-index:20;box-shadow:0 4px 18px rgba(15,42,68,.25)}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--gold2),var(--gold));display:grid;place-items:center;font-weight:800;color:var(--navy)}
h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.2px}
.sub{font-size:12px;opacity:.75}
.actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:10px;padding:9px 14px;font:600 13px Inter,sans-serif;cursor:pointer;background:rgba(255,255,255,.12);color:#fff;transition:.15s}
.btn:hover{background:rgba(255,255,255,.22)}
.btn.gold{background:var(--gold2);color:var(--navy)}
.btn.gold:hover{background:#ffd76e}
.btn.light{background:#f1f5f9;color:var(--navy)}
.btn.light:hover{background:#e2e8f0}
.status{font-size:12px;opacity:.85}
nav{display:flex;gap:4px;margin-top:14px;overflow-x:auto}
nav button{background:none;border:0;color:#cbd5e1;padding:10px 14px;font:600 13px Inter,sans-serif;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:#fff;border-color:var(--gold2)}
main{padding:20px;max-width:1500px;margin:0 auto}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:stretch}
.card{background:var(--card);border-radius:16px;box-shadow:0 1px 3px rgba(15,23,42,.06),0 6px 20px rgba(15,23,42,.05);padding:16px 18px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card h2 .tag{font-size:11px;font-weight:600;color:var(--mute);background:#f1f5f9;border-radius:20px;padding:3px 9px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:0 1px 3px rgba(15,23,42,.06);border-top:4px solid var(--navy2)}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);font-weight:700}
.kpi .v{font-size:26px;font-weight:800;margin-top:4px}
.kpi .s{font-size:12px;color:var(--mute)}
.kpi.etq{border-color:var(--etq)}.kpi.pes{border-color:var(--pes)}.kpi.sor{border-color:var(--sor)}.kpi.ns{border-color:var(--ns)}.kpi.gold{border-color:var(--gold)}
.seg{display:inline-flex;background:#e2e8f0;border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;padding:8px 16px;border-radius:9px;font:700 13px Inter,sans-serif;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--navy);color:#fff;box-shadow:0 2px 8px rgba(15,42,68,.3)}
.tw{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
thead th{background:#f8fafc;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:#475569;position:sticky;top:0}
th.grp{color:#fff;font-size:12px;letter-spacing:.8px}
th.g-etq{background:var(--etq)}th.g-pes{background:var(--pes)}th.g-sor{background:var(--sor)}th.g-ns{background:var(--ns)}th.g-nav{background:var(--navy2)}th.g-gold{background:var(--gold)}
td.lbl{text-align:left;font-weight:600}
tfoot td{font-weight:800;background:#f8fafc}
td.num{font-variant-numeric:tabular-nums}
input{font:500 13px Inter,sans-serif;color:var(--inb);background:var(--in);border:1px solid #f0dfa0;border-radius:7px;padding:5px 6px;width:78px;text-align:center}
input[type=time]{width:104px}
input.w{width:120px}input.ww{width:160px;text-align:left}
input:focus{outline:2px solid var(--gold2);background:#fff}
input::placeholder{color:#a8b3c4}
.pos{color:var(--ok);font-weight:700}.neg{color:var(--bad);font-weight:700}
.note{font-size:12px;color:var(--mute);margin-top:8px;line-height:1.5}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px}
.bar{height:8px;border-radius:6px;background:#e2e8f0;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.toast{position:fixed;right:20px;bottom:20px;background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transform:translateY(10px);transition:.25s;z-index:50;max-width:340px}
.toast.on{opacity:1;transform:none}
.chart{width:100%;height:240px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:#eef2ff;color:#3730a3}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:16px;padding:20px;max-width:640px;width:100%;max-height:85vh;overflow:auto}
textarea{width:100%;height:220px;font:12px monospace;border:1px solid var(--line);border-radius:10px;padding:10px}

/* sem barras de rolagem: tudo expandido */
html,body{overflow-x:hidden}
main{max-width:none}
.tw{overflow:visible}
table{table-layout:auto}
th,td{padding:5px 3px;white-space:normal}
thead th{font-size:10px;letter-spacing:.2px;position:static}
input{width:100%;min-width:40px;padding:5px 2px;font-size:12.5px}
input[type=time]{width:100%;min-width:62px;font-size:12px}
input[type=time]::-webkit-calendar-picker-indicator{display:none}
input.w{width:100%;min-width:64px}
nav{flex-wrap:wrap;overflow:visible}
.grid2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}

.gout{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(0,1fr);gap:16px;align-items:start}
.gout .card{margin-bottom:16px}
@media (max-width:1100px){.gout{grid-template-columns:1fr}}
table.big th,table.big td{padding:4px 2px}
table.big{font-size:12px}
table.big input{min-width:34px;padding:4px 1px;font-size:12px}
table.big input[type=time]{min-width:0;width:52px;font-size:11px;padding:4px 0}
table.big thead th{text-transform:none;letter-spacing:0;font-size:10.5px;white-space:normal}
table.big th{font-size:9.5px}
table.big td.oc,table.big th.oth{background:#f6f8fc}
.hero{background:radial-gradient(1200px 300px at 85% -40%,rgba(242,193,78,.35),transparent 60%),linear-gradient(120deg,#0b2238,#1f4e78);color:#fff;border-radius:20px;padding:22px 24px;margin-bottom:18px;box-shadow:0 14px 40px rgba(15,42,68,.28)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:16px}
.hero-k{font-size:11px;letter-spacing:2px;color:#f2c14e;font-weight:800}
.hero-t{font-size:24px;font-weight:800;margin-top:4px}
.hero-d{font-size:13px;color:#cbd5e1;margin-top:2px}
.hx{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:16px}
.hx-tile{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 14px;backdrop-filter:blur(4px)}
.hx-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.hx-l{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:#cbd5e1;font-weight:700}
.hx-v{font-size:24px;font-weight:800;line-height:1.1}
.hx-s{font-size:11px;color:#94a3b8}
.cy-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;margin-bottom:16px}
.cy{background:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 1px 3px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.06);cursor:pointer;border:2px solid transparent;transition:.15s}
.cy:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(15,23,42,.12)}
.cy.on{border-color:#f2c14e}
.cy-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cy-b{background:linear-gradient(135deg,#0f2a44,#1f4e78);color:#fff;font-weight:800;border-radius:10px;padding:5px 12px;font-size:14px}
.cy-st{font-size:11.5px;font-weight:700;color:#64748b;background:#f1f5f9;border-radius:20px;padding:3px 9px}
.cy-st.pos{background:#dcfce7}.cy-st.neg{background:#fee2e2}
.cy-m{display:flex;align-items:center;gap:10px;margin:8px 0}
.cy-l{flex:1;display:grid;gap:5px;font-size:12.5px;color:#475569}
.cy-l div{display:flex;align-items:center;gap:7px}
.cy-l i{width:9px;height:9px;border-radius:3px;display:inline-block}
.cy-l b{margin-left:auto;color:#14213d;font-variant-numeric:tabular-nums}
.cy-f{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;font-size:11.5px;color:#64748b;border-top:1px dashed #e2e8f0;padding-top:8px}
.cy-f b{color:#14213d}

(function(){

(function migrarCPM(){const ren=o=>{if(o&&typeof o==='object'&&!Array.isArray(o)&&('AM0' in o)&&!('CPM' in o)){o.CPM=o.AM0;delete o.AM0;}};

let tab=(location.hash||'').replace('#','');if(!TABS.some(t=>t[0]===tab))tab='dashboard';
let dirty=false,artifact=null,downloads=null;

const fmt=n=>(n==null||n===''||isNaN(n))?'–':Math.round(n).toLocaleString('pt-BR');

const num=v=>(v===''||v==null||isNaN(+v))?null:+v;
function mins(t){if(!t)return null;const[h,m]=t.split(':').map(Number);return h*60+m;}
function dur(a,b){const x=mins(a),y=mins(b);if(x==null||y==null)return 0;let d=y-x;if(d<0)d+=1440;return d/60;}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2600);}

function touch(){dirty=true;try{localStorage.setItem(LS,JSON.stringify(Object.assign({},S,{_savedAt:Date.now()})));}catch(e){}setStatus();}
function getP(path){return path.split('.').reduce((o,k)=>o==null?o:o[k],S);}

function inp(path,type,cls,ph){const v=getP(path);return `<input data-p="${path}" data-t="${type||'n'}" ${type==='time'?'type="time"':type==='s'?'type="text"':'type="number" step="any"'} class="${cls||''}" value="${v==null?'':esc(v)}" placeholder="${ph==null?'':esc(ph)}">`;}

/* ---------------- Cálculos ---------------- */
function calcCiclo(c){
  const g=S.grid[c],p=S.prod[c],exp=expTotal();
  let aE=0,aP=0,aS=0,aNP=0,aNS=0;
  const rows=g.map((r,i)=>{
    const pr=p[i]||{};
    const dE=dur(r.etq[0],r.etq[1]),dP=dur(r.pesca[0],r.pesca[1]),dS=dur(r.sort[0],r.sort[1]);
    const banc=num(r.banc)||0,ilhas=num(r.ilhas)||0,hc=num(r.hc)||0;
    const pE=Math.round(banc*(num(pr.etq)||0)*dE);let pP=Math.round(ilhas*(num(pr.pesca)||0)*dP);const pS=Math.round(hc*(num(pr.sort)||0)*dS);
    const prNP=num(pr.nsPesca)!=null?num(pr.nsPesca):(num(pr.pesca)||0);
    const prNS=num(pr.nsSort)!=null?num(pr.nsSort):(num(pr.sort)||0);
    const nIl=num(r.nsIlhas)!=null?num(r.nsIlhas):ilhas,nHc=num(r.nsHc)!=null?num(r.nsHc):hc;
    const nExtra=(num(r.nsIlhas)!=null?num(r.nsIlhas):0)+(num(r.nsHc)!=null?num(r.nsHc):0);
    const nP=Math.round(nIl*prNP*dP),nS=Math.round(nHc*prNS*dS);
    aE+=pE;aP+=pP;aS+=pS;aNP+=nP;aNS+=nS;
    const outros=r.outros.map(Number).map(x=>x||0);
    if(exp!=null&&(outros[5]>0||i===0))outros[5]=exp;
    const pessoas=banc*3;
    const abs=outros[7];
    const necess=pessoas+ilhas+hc+nExtra+outros.slice(0,7).reduce((a,b)=>a+b,0);
    return {i,nIl,nHc,nExtra,dE,dP,dS,banc,pessoas,ilhas,hc,pE,pP,pS,aE,aP,aS,nP,nS,aNP,aNS,outros,abs,necess,total:necess+abs};
  });
  if(!S.ajuste)S.ajuste={};if(!S.ajuste[c])S.ajuste[c]={buffered:null,etqBranca:null};
  const X=(num(S.ajuste[c].buffered)||0)+(num(S.ajuste[c].etqBranca)||0);
  return {rows,X,tEb:aE,tPb:aP,tE:aE+X,tP:aP-X,tS:aS,tNP:aNP,tNS:aNS,tSort:aS+aNS};
}
function expTotal(){const v=S.expedicao.map(r=>num(r[2])).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0):null;}
function recursos(c){
  const h=S.horario[c],P=S.prod[c]||[],v=S.volume[c];
  const dE=dur(h.ini,h.fimEtq),dS=dur(h.ini,h.fimSort);
  const avg=k=>{const xs=P.map(p=>num(p[k])).filter(x=>x>0);return xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:0;};
  const pE=avg('etq'),pP=avg('pesca'),pS=avg('sort');
  const vE=num(v.etq)||0,vP=num(v.pesca)||vE;
  const banc=(pE&&dE)?Math.ceil(vE/(pE*dE)):0;
  const ilhasNec=(pP&&dE)?Math.ceil(vP/(pP*dE)):0;
  const ilhas=S.setores[c].reduce((a,b)=>a+(num(b)||0),0);
  const hc=(pS&&dS)?Math.ceil(vP/(pS*dS)):0;
  const G=S.grid[c]||[];const mx=k=>G.reduce((m,r)=>Math.max(m,num(r[k])||0),0);
  return {dE,dP:dE,dS,pE,pP,pS,banc,pessoas:banc*3,ilhas,ilhasNec,hc,total:banc+ilhas+hc,plan:{banc:mx('banc'),ilhas:mx('ilhas'),hc:mx('hc')},fim:(mins(h.fimEtq)>mins(h.fimSort)?h.fimEtq:h.fimSort)};
}

const COR={etq:'#2f6fb0',sort:'#c8961e',pesca:'#3f9e5a',ns:'#8a4fd0'};
function fimSortOf(c,R){return R.rows.filter(r=>r.pS>0).map(r=>S.grid[c][r.i].sort[1]).filter(Boolean).sort((x,y)=>mins(x)-mins(y)).pop()||null;}
function expStatus(c,fim){const p=(S.expPrev||{})[c]||{};const a=p.expedicao||p.subida;if(!a||!fim)return {txt:'—',cls:''};const d=mins(a)-mins(fim);return d>=0?{txt:`✅ folga ${d}min`,cls:'pos'}:{txt:`⚠️ atraso ${-d}min`,cls:'neg'};}
function legend(items){return `<div class="row" style="gap:14px;font-size:12px;color:var(--mute);margin-bottom:6px">${items.map(([n,c,dash])=>`<span style="display:inline-flex;align-items:center;gap:6px"><i style="display:inline-block;width:14px;height:${dash?0:10}px;border-radius:3px;background:${dash?'none':c};border-top:${dash?'2px dashed '+c:'0'}"></i>${n}</span>`).join('')}</div>`;}
function ring(p,col,size){const r=size/2-7,C=2*Math.PI*r,v=Math.max(0,Math.min(1,p/100));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#e8edf5" stroke-width="9"/>${v>0?'':'<!--'}<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C*v} ${C}" transform="rotate(-90 ${size/2} ${size/2})"/>${v>0?'':'-->'}<text x="50%" y="48%" text-anchor="middle" font-size="${size/5}" font-weight="800" fill="#14213d">${Math.round(p)}%</text><text x="50%" y="66%" text-anchor="middle" font-size="10" fill="#64748b">do volume</text></svg>`;}

   <div class="hx">${tile('🏷️','Etiquetagem',fmt(T.e),'todos os ciclos',COR.etq)}${tile('🎣','Pesca',fmt(T.p),'todos os ciclos',COR.pesca)}${tile('📦','Sorting total',fmt(T.s),'ciclo + N-SACA',COR.sort)}${tile('👥','HC de pico',fmt(T.hc),'soma dos ciclos','#5b6b8c')}</div></div>`;
  h+=`<div class="cy-grid">${D.map(d=>{const pc=d.vol?d.R.tSort/d.vol*100:0,col=pc>=100?'#16a34a':pc>=80?'#f59e0b':'#dc2626';

  // barras

  [0,.25,.5,.75,1].forEach(f=>{const tk=Math.round(mx*f),y=H-B-sc(tk);bars+=`<line x1="${L}" x2="${W-6}" y1="${y}" y2="${y}" stroke="#eef2f7" ${f?'stroke-dasharray="3 4"':''}/><text x="${L-8}" y="${y+3}" font-size="10" text-anchor="end" fill="#94a3b8">${fmt(tk)}</text>`;});
  D.forEach((d,i)=>{const x0=L+i*gw+(gw-3*bw-6)/2;if(d.c===sel)bars+=`<rect x="${L+i*gw+4}" y="8" width="${gw-8}" height="${H-B-8}" rx="10" fill="#f6f8fc"/>`;
    [['Etiquetagem',d.R.tE,'url(#ge)'],['Pesca',d.R.tP,'url(#gp)'],['Total Sorting',d.R.tSort,'url(#gs)']].forEach(([n,v,c],k)=>{const hh=sc(Math.max(0,v)),x=x0+k*(bw+3),y=H-B-hh;
      bars+=`<path d="M${x},${H-B} V${y+Math.min(5,hh)} q0,-5 5,-5 h${bw-10} q5,0 5,5 V${H-B} Z" fill="${c}" data-tip="${d.c} · ${n}: ${fmt(v)}"/>`;});
    const yv=H-B-sc(d.vol);bars+=`<line x1="${x0-8}" x2="${x0+3*bw+14}" y1="${yv}" y2="${yv}" stroke="#0f172a" stroke-width="2" stroke-dasharray="5 4" data-tip="${d.c} · Volume: ${fmt(d.vol)}"/>`;
    bars+=`<text x="${x0+1.5*bw+3}" y="${H-12}" font-size="12.5" font-weight="800" text-anchor="middle" fill="${d.c===sel?'#0f2a44':'#64748b'}">${d.c}</text>`;});
  bars+=`<line x1="${L}" x2="${W-6}" y1="${H-B}" y2="${H-B}" stroke="#cbd5e1"/>`;
  h+=`<div class="grid2"><div class="card"><h2>📊 Produção × Volume por ciclo</h2>${legend([['Etiquetagem',COR.etq],['Pesca',COR.pesca],['Total Sorting',COR.sort],['Volume','#0f172a',1]])}<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${bars}</svg></div>`;
  // linhas
  const c=sel,d=D.find(x=>x.c===c),R=d.R;

  const W2=560,H2=270,L2=52,RM=100,mx2=Math.max(1,d.vol,...pts.map(p=>Math.max(p.e,p.p,p.s)));
  const X=i=>L2+i*(W2-L2-RM)/Math.max(1,pts.length-1),Y=v=>H2-B-(H2-B-18)*v/mx2;
  let g=`<defs>${[['ae',COR.etq],['ap',COR.pesca],['as',COR.sort]].map(([id,c])=>`<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".22"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient>`).join('')}</defs>`;
  [0,.25,.5,.75,1].forEach(f=>{const tk=Math.round(mx2*f),y=Y(tk);g+=`<line x1="${L2}" x2="${W2-RM}" y1="${y}" y2="${y}" stroke="#eef2f7" ${f?'stroke-dasharray="3 4"':''}/><text x="${L2-8}" y="${y+3}" font-size="10" text-anchor="end" fill="#94a3b8">${fmt(tk)}</text>`;});

    ends.push({y:Y(pts[pts.length-1][k]),n,cl});});
  ends.sort((a,b)=>a.y-b.y);for(let i=1;i<ends.length;i++)if(ends[i].y-ends[i-1].y<14)ends[i].y=ends[i-1].y+14;

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT')e.target.blur();});
window.addEventListener('hashchange',()=>{const h=location.hash.replace('#','');if(VIEWS[h]&&h!==tab){tab=h;render();}});
setInterval(()=>{if(tab==='pd'&&!document.activeElement.matches('input'))render();},60000);

/* ---------------- Salvar / Exportar ---------------- */
function buildDoc(){
  const st=JSON.stringify(Object.assign({},S,{_savedAt:Date.now()})).replace(/</g,'\\u003c');
  const css=document.getElementById('app-css').textContent,js=document.getElementById('app-js').textContent;
  const body=document.body.cloneNode(false);
  return '<!DOCTYPE html>\n<html lang="pt-BR">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>Labor x Produtividade — Operação Meli</title>\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">\n<style id="app-css">'+css+'</style>\n</head>\n<body>\n'+SHELL+'\n<script type="application/json" id="app-state">'+st+'</'+'script>\n<script id="app-js">'+js+'</'+'script>\n</body>\n</html>';
}
const SHELL=(()=>{const parts=[];for(const n of document.body.children){if(n.tagName==='SCRIPT')break;const c=n.cloneNode(true);if(c.id==='app'||c.id==='nav')c.innerHTML='';c.querySelectorAll&&c.querySelectorAll('#app,#nav,#status').forEach(x=>x.innerHTML='');parts.push(c.outerHTML);}return parts.join('\n');})();
async function save(){
  if(!artifact){try{localStorage.setItem(LS,JSON.stringify(Object.assign({},S,{_savedAt:Date.now()})));}catch(e){}dirty=false;S._savedAt=Date.now();setStatus();toast('Salvo neste navegador. (Para salvar na nuvem, abra pelo link do Claude.)');return;}
  $('#btnSave').disabled=true;toast('Salvando…');
  try{S._savedAt=Date.now();await artifact.publish(buildDoc());dirty=false;try{localStorage.removeItem(LS);}catch(e){}toast('✓ Salvo! Todos que abrirem o link verão estes dados.');}
  catch(err){const c=(err&&(err.code||err.name))||'';toast(c==='conflict'?'Outra pessoa salvou antes — a página foi atualizada.':(c==='not_granted'||c==='not_writer')?'Você só tem permissão de leitura.':'Não deu para salvar agora. Tente de novo.');}
  finally{$('#btnSave').disabled=false;setStatus();}
}
function csvCiclo(){
  const c=S.cicloSel,R=calcCiclo(c),L=[];const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  L.push(['Ciclo '+c].map(q).join(';'));
  L.push(['Faixa','Etq Início','Etq Fim','Dur','Bancadas','Pessoas','Produção Etq','Acum Etq','Pesca Início','Pesca Fim','Ilhas','Produção Pesca','Acum Pesca','Sort Início','Sort Fim','HC','Produção Sorting','Acum Sorting','N-SACA Pesca','N-SACA Sorting','HC total'].map(q).join(';'));
  R.rows.forEach((r,i)=>{const g=S.grid[c][i];L.push([i+1,g.etq[0],g.etq[1],r.dE.toFixed(2).replace('.',','),r.banc,r.pessoas,r.pE,r.aE,g.pesca[0],g.pesca[1],r.ilhas,r.pP,r.aP,g.sort[0],g.sort[1],r.hc,r.pS,r.aS,r.nP,r.nS,r.total].map(q).join(';'));});
  L.push(['Totais','','','','','',R.tE,'','','','',R.tP,'','','','',R.tS,'',R.tNP,R.tNS,''].map(q).join(';'));
  L.push(['TOTAL SORTING (ciclo + N-SACA)',R.tSort].map(q).join(';'));
  return '﻿'+L.join('\r\n');
}
function modal(html){$('#modalBox').innerHTML=html;$('#modal').classList.add('on');}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'||e.target.dataset.close!=null)$('#modal').classList.remove('on');});
async function exportCSV(){
  const data=csvCiclo(),fn=`ciclo_${S.cicloSel}_${new Date().toISOString().slice(0,10)}.csv`;
  if(downloads){try{await downloads.save({filename:fn,data});toast('Arquivo pronto: '+fn);return;}catch(e){}}
  modal(`<h2>CSV do ciclo ${S.cicloSel}</h2><p class="note">Copie e cole no Excel ou no Google Sheets.</p><textarea readonly>${esc(data.slice(1))}</textarea><div class="row" style="margin-top:10px;gap:8px"><button class="btn gold" id="cp">Copiar</button><button class="btn light" data-close>Fechar</button></div>`);
  $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(data.slice(1));toast('Copiado!');}catch(e){toast('Selecione o texto e copie com Ctrl+C.');}};
}
function backup(){
  const data=JSON.stringify(S);
  modal(`<h2>Backup dos dados</h2><p class="note">Copie o texto para guardar, ou cole um backup e clique em Restaurar.</p><textarea id="bk">${esc(data)}</textarea><div class="row" style="margin-top:10px;gap:8px"><button class="btn gold" id="cp">Copiar</button>${downloads?'<button class="btn light" id="dl">Baixar .json</button>':''}<button class="btn light" id="rs">Restaurar</button><button class="btn light" data-close>Fechar</button></div>`);
  $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText($('#bk').value);toast('Copiado!');}catch(e){toast('Selecione o texto e copie com Ctrl+C.');}};
  if($('#dl'))$('#dl').onclick=async()=>{try{await downloads.save({filename:'backup_labor_produtividade.json',data:$('#bk').value});}catch(e){}};
  $('#rs').onclick=()=>{try{const o=JSON.parse($('#bk').value);if(!o.grid||!o.prod)throw 0;S=o;touch();render();$('#modal').classList.remove('on');toast('Backup restaurado — clique em Salvar.');}catch(e){toast('Backup inválido.');}};
}
$('#btnSave').onclick=save;$('#btnExport').onclick=exportCSV;$('#btnBackup').onclick=backup;
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});

if(S.expedicao&&S.expedicao.length&&!S.expedicao[0][0]&&S.expedicao[1]&&S.expedicao[1][0]==='YMS')S.expedicao.shift();
function hojeStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function zerarPessoas(){
  CICLOS.forEach(c=>{(S.grid[c]||[]).forEach(r=>{r.banc=null;r.ilhas=null;r.hc=null;r.nsIlhas=null;r.nsHc=null;r.outros=r.outros.map(()=>null);});
    if(S.hcReal)S.hcReal[c]=(S.grid[c]||[]).map(()=>null);
    if(S.ajuste&&S.ajuste[c])S.ajuste[c]={buffered:null,etqBranca:null};});
  (S.expedicao||[]).forEach(r=>r[2]=null);
  S.realizado={};S.ctlRec={};
  if(S.pdPend)S.pdPend={buffered:null,etqBranca:null};
}
if(S.dia!==hojeStr()){const primeira=!S.dia;zerarPessoas();S.dia=hojeStr();setTimeout(()=>{touch();toast('📅 Novo dia ('+new Date().toLocaleDateString('pt-BR')+') — pessoas zeradas em todos os ciclos. Preencha e clique em Salvar.');},300);}
$('#btnZerar').onclick=()=>{modal(`<h2>Zerar pessoas?</h2><p class="note">Bancadas, Ilhas, HC, outros setores, N-SACA, HC Real, Expedição e Buffered/ETQ Branca de <b>todos os ciclos</b> ficam em branco. Horários, volumes e produtividade continuam.</p><div class="row" style="gap:8px;margin-top:10px"><button class="btn gold" id="zOk">Zerar</button><button class="btn light" data-close>Cancelar</button></div>`);$('#zOk').onclick=()=>{zerarPessoas();touch();render();$('#modal').classList.remove('on');toast('Pessoas zeradas.');};};
render();
if(window.claude&&claude.use){claude.use('artifact').then(a=>{artifact=a;setStatus();}).catch(()=>{});claude.use('downloads').then(d=>{downloads=d;}).catch(()=>{});}
})();
</script>
</body>
</html>
