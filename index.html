<style id="app-css">
:root{
  --navy:#0f2a44;--navy2:#1f4e78;--gold:#c8961e;--gold2:#f2c14e;--bg:#eef2f7;--card:#fff;--ink:#14213d;--mute:#64748b;
  --line:#e2e8f0;--in:#fff8dc;--inb:#2563eb;--ok:#15803d;--bad:#b91c1c;--etq:#2f6fb0;--pes:#3f7d3a;--sor:#b07d12;--ns:#6d3fb0;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;padding:18px 22px 0;position:sticky;top:0;z-index:20;box-shadow:0 4px 18px rgba(15,42,68,.25)}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--gold2),var(--gold));display:grid;place-items:center;font-weight:800;color:var(--navy)}
h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.2px}
.sub{font-size:12px;opacity:.75}
.actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:10px;padding:9px 14px;font:600 13px Inter,sans-serif;cursor:pointer;background:rgba(255,255,255,.12);color:#fff;transition:.15s}
.btn:hover{background:rgba(255,255,255,.22)}
.btn.gold{background:var(--gold2);color:var(--navy)}
.btn.gold:hover{background:#ffd76e}
.btn.light{background:#f1f5f9;color:var(--navy)}
.btn.light:hover{background:#e2e8f0}
.status{font-size:12px;opacity:.85}
nav{display:flex;gap:4px;margin-top:14px;overflow-x:auto}
nav button{background:none;border:0;color:#cbd5e1;padding:10px 14px;font:600 13px Inter,sans-serif;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:#fff;border-color:var(--gold2)}
main{padding:20px;max-width:1500px;margin:0 auto}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:stretch}
.card{background:var(--card);border-radius:16px;box-shadow:0 1px 3px rgba(15,23,42,.06),0 6px 20px rgba(15,23,42,.05);padding:16px 18px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card h2 .tag{font-size:11px;font-weight:600;color:var(--mute);background:#f1f5f9;border-radius:20px;padding:3px 9px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:0 1px 3px rgba(15,23,42,.06);border-top:4px solid var(--navy2)}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);font-weight:700}
.kpi .v{font-size:26px;font-weight:800;margin-top:4px}
.kpi .s{font-size:12px;color:var(--mute)}
.kpi.etq{border-color:var(--etq)}.kpi.pes{border-color:var(--pes)}.kpi.sor{border-color:var(--sor)}.kpi.ns{border-color:var(--ns)}.kpi.gold{border-color:var(--gold)}
.seg{display:inline-flex;background:#e2e8f0;border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;padding:8px 16px;border-radius:9px;font:700 13px Inter,sans-serif;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--navy);color:#fff;box-shadow:0 2px 8px rgba(15,42,68,.3)}
.tw{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
thead th{background:#f8fafc;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:#475569;position:sticky;top:0}
th.grp{color:#fff;font-size:12px;letter-spacing:.8px}
th.g-etq{background:var(--etq)}th.g-pes{background:var(--pes)}th.g-sor{background:var(--sor)}th.g-ns{background:var(--ns)}th.g-nav{background:var(--navy2)}th.g-gold{background:var(--gold)}
td.lbl{text-align:left;font-weight:600}
tfoot td{font-weight:800;background:#f8fafc}
td.num{font-variant-numeric:tabular-nums}
input{font:500 13px Inter,sans-serif;color:var(--inb);background:var(--in);border:1px solid #f0dfa0;border-radius:7px;padding:5px 6px;width:78px;text-align:center}
input[type=time]{width:104px}
input.w{width:120px}input.ww{width:160px;text-align:left}
input:focus{outline:2px solid var(--gold2);background:#fff}
input::placeholder{color:#a8b3c4}
.pos{color:var(--ok);font-weight:700}.neg{color:var(--bad);font-weight:700}
.note{font-size:12px;color:var(--mute);margin-top:8px;line-height:1.5}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px}
.bar{height:8px;border-radius:6px;background:#e2e8f0;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.toast{position:fixed;right:20px;bottom:20px;background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transform:translateY(10px);transition:.25s;z-index:50;max-width:340px}
.toast.on{opacity:1;transform:none}
.chart{width:100%;height:240px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:#eef2ff;color:#3730a3}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:16px;padding:20px;max-width:640px;width:100%;max-height:85vh;overflow:auto}
textarea{width:100%;height:220px;font:12px monospace;border:1px solid var(--line);border-radius:10px;padding:10px}

function expAplica(c,i){const g=(S.grid[c]||[])[i];if(!g)return false;

function preencherGrade(c){const r=recursos(c);(S.grid[c]||[]).forEach(g=>{

function recursos(c){
  const h=S.horario[c],P=S.prod[c]||[],v=S.volume[c];
  const dE=dur(h.etqIni,h.etqFim),dP=dur(h.pesIni,h.pesFim),dS=dur(h.sortIni,h.sortFim);

  const fim=[h.etqFim,h.pesFim,h.sortFim].filter(Boolean).sort((a,b)=>mins(a)-mins(b)).pop()||'';
  const avg=k=>{const xs=P.map(p=>num(p[k])).filter(x=>x>0);return xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:0;};

function gLerCsv(txt){

function gAcharCab(linhas){

async function gPrepImg(blob){
  try{const bm=await createImageBitmap(blob);const M=2400;const k=Math.min(1,M/Math.max(bm.width,bm.height));if(k>=1&&blob.size<4e6)return blob;
    const c=document.createElement('canvas');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,'image/jpeg',0.9));}catch(e){return blob;}
}
let gImgMax=4,gLendoT0=0,gLendoTxt='';
async function gTiles(blob){
  const bm=await createImageBitmap(blob);const W=bm.width,H=bm.height;const out=[];
  const toBlob=(sx,sy,sw,sh)=>{const k=Math.min(1,2400/Math.max(sw,sh));const c=document.createElement('canvas');c.width=Math.round(sw*k);c.height=Math.round(sh*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bm,sx,sy,sw,sh,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',0.92));};
  out.push(await toBlob(0,0,W,H));
  const mp=W*H/1e6;const vagas=Math.max(0,gImgMax-1);
  if(mp>1.3&&vagas>=2){
    let cols=W>=H?2:1,rows=W>=H?1:2;if(vagas>=4){cols=2;rows=2;}if(vagas>=6&&W>H*1.6){cols=3;rows=2;}
    const ov=0.08;const tw=W/cols,th=H/rows;
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){if(out.length>=gImgMax)break;const sx=Math.max(0,c*tw-tw*ov),sy=Math.max(0,r*th-th*ov);const sw=Math.min(W-sx,tw*(1+2*ov)),sh=Math.min(H-sy,th*(1+2*ov));out.push(await toBlob(sx,sy,sw,sh));}
  }
  return out;
}
function gMesclar(G,itens){
  const cab=['Onda','Rua','Vaga','Rota','Transportadora','Origem'];const linhas=[cab];
  const temArq=G&&G.map&&G.map.rota>=0;
  const arq=temArq?G.linhas.map(L=>({rota:String(L[G.map.rota]||'').trim(),transp:G.map.transp>=0?String(L[G.map.transp]||'').trim():'',onda:G.map.onda>=0?String(L[G.map.onda]||'').trim():''})).filter(r=>r.rota):[];
  const idx={};arq.forEach((r,i)=>{const k=gNormRota(r.rota);(idx[k]=idx[k]||[]).push(i);});
  const usado=new Set();let lig=0;
  const achar=rota=>{const k=gNormRota(rota);if(!k)return -1;let L=(idx[k]||[]).filter(i=>!usado.has(i));if(L.length)return L[0];
    const cand=arq.map((r,i)=>i).filter(i=>{if(usado.has(i))return false;const a=gNormRota(arq[i].rota);return a.length>=2&&k.length>=2&&(a.includes(k)||k.includes(a));});return cand.length===1?cand[0]:-1;};
  itens.forEach(it=>{const i=achar(it.rota);let rota=it.rota,transp=it.transp,onda=it.onda,orig='Layout';
    if(i>=0){usado.add(i);lig++;const a=arq[i];rota=a.rota;transp=it.transp||a.transp;onda=it.onda||a.onda;orig='Layout + arquivo';}
    linhas.push([onda,it.rua,it.vaga,rota,transp,orig]);});
  const semVaga=[];arq.forEach((a,i)=>{if(!usado.has(i)){semVaga.push(a.rota);linhas.push([a.onda,'','',a.rota,a.transp,'Só no arquivo']);}});
  const abasOrig=G&&G.abas?G.abas.filter(a=>a.nome!=='Layout + arquivo'):[];
  const NG={arquivo:(G&&G.arquivo&&G.arquivo!=='imagem do layout'?G.arquivo+' + ':'')+'imagem do layout',em:new Date().toLocaleString('pt-BR'),abas:[{nome:'Layout + arquivo',linhas},...abasOrig],cores:(G&&G.cores)||{},modo:(G&&G.modo)||'rua',modoV2:1};
  gAplicarAba(NG,0);return {NG,lig,semVaga,temArq,naoArq:itens.length-lig};
}
async function gLerImagem(){

    gImgRes=`✓ <b>${novo.length}</b> sigla(s) e <b>${tot}</b> vaga(s) lidas do layout.${semT.length?` <span class="neg">Escolha a transportadora de: ${semT.map(esc).join(', ')}</span>`:''}<br><span class="note" style="margin:0">Confira no quadro "Layout do SVC" abaixo — dá para corrigir sigla, transportadora e vagas.</span>`;

  }catch(err){const c=err&&err.code;const m={rate_limited:'Muitas leituras seguidas ou limite de uso do Claude atingido — espere um pouco e tente de novo.',not_granted:'A leitura não foi autorizada. Recarregue a página e clique em Permitir quando o Claude pedir.',sampling_disabled:'O Claude não está disponível para esta conta.',images_unavailable:'Este acesso não permite enviar imagens ao Claude. Abra pelo link do Claude no computador.',image_rejected:'O Claude não aceitou essa imagem. Tente salvar o print como PNG ou JPG.',invalid_json:'O Claude respondeu, mas fora do formato. Clique de novo em Puxar.',refused:'O Claude não quis ler essa imagem.',session_expired:'Sua sessão do Claude expirou. Entre de novo e recarregue.'};

  finally{clearInterval(tick);gLendo=false;render();}
}

function colS(){if(!S.colab)S.colab={lista:[],map:null,em:'',fonte:{...COLAB_FONTE}};if(!S.colab.lista)S.colab.lista=[];if(!S.colab.lista.length){S.colab.lista=COLAB_BASE.map(([cod,nome])=>({cod,nome}));S.colab.em='lista de 24/11/2026';}if(!S.colab.fonte)S.colab.fonte={...COLAB_FONTE};return S.colab;}
const colNorm=v=>gNorm(v).toUpperCase().replace(/\s+/g,' ').trim();
function colAchar(v){const L=colS().lista;const k=colNorm(v);if(!k)return null;return L.find(c=>colNorm(c.cod)===k)||L.find(c=>colNorm(c.nome)===k)||null;}
function colDetect(linhas){let best=-1,bi=0,bm=null;
  for(let i=0;i<Math.min(15,linhas.length);i++){const L=(linhas[i]||[]).map(x=>gNorm(x).toLowerCase());
    const nome=L.findIndex(x=>/^(nome|colaborador|funcionario|nome completo|nome do colaborador)/.test(x));
    const cod=L.findIndex(x=>/(groot|^cod|codigo|matric|login|^id\b|^id |^ext|crach|badge|^re$|^cpf)/.test(x));
    let cd=cod;if(cd<0){let bc=-1,bv=0;const R=linhas.slice(i+1,i+60);(linhas[i]||[]).forEach((_,j)=>{if(j===nome)return;const v=R.filter(L=>/^\d{5,10}$/.test(String((L||[])[j]??'').trim())).length;if(v>bv){bv=v;bc=j;}});if(bv>=3)cd=bc;}
    const sc=(nome>=0?2:0)+(cd>=0?1:0);if(sc>best){best=sc;bi=i;bm={nome,cod:cd};}}
  return {hi:bi,map:bm};}
function colAplicar(linhas,map,hi){const C=colS();const manuais=C.lista.filter(c=>c.manual);const out=[];const vis=new Set();
  linhas.slice(hi+1).forEach(L=>{const nome=String((L||[])[map.nome]??'').trim();const cod=map.cod>=0?String((L||[])[map.cod]??'').trim():'';if(!nome)return;const k=colNorm(cod)+'|'+colNorm(nome);if(vis.has(k))return;vis.add(k);out.push({cod,nome});});
  manuais.forEach(m=>{if(!out.some(o=>colNorm(o.nome)===colNorm(m.nome)))out.push(m);});
  C.lista=out;C.map=map;C.em=new Date().toLocaleString('pt-BR');touch();render();toast('✓ '+out.length+' colaborador(es) carregado(s).');}
function colMapear(linhas){colabRaw=linhas;const d=colDetect(linhas);const cab=(linhas[d.hi]||[]).map((x,i)=>String(x||'Coluna '+(i+1)));
  const C=colS();const m=(C.map&&C.map.nome<cab.length)?C.map:d.map;
  if(d.map.nome>=0&&!colMapAberto){colAplicar(linhas,{nome:m.nome>=0?m.nome:d.map.nome,cod:m.cod},d.hi);return;}
  modal(`<h3 style="margin:0 0 8px">Quais colunas usar?</h3><div class="note" style="margin:0 0 10px">Escolha a coluna do <b>nome</b> e a do <b>código</b> (crachá / Groot ID / login).</div>

async function colAuto(){if(colAutoFeito)return;colAutoFeito=true;if(location.protocol==='file:'&&false)return;const F=colS().fonte;try{const r=await fetch(`https://docs.google.com/spreadsheets/d/${F.id}/gviz/tq?tqx=out:csv&gid=${F.gid}`);if(!r.ok)return;const t=await r.text();if(/<html/i.test(t.slice(0,200)))return;const linhas=gLerCsv(t)[0].linhas.filter(L=>L&&L.some(x=>String(x).trim()));if(!linhas.length)return;const d=colDetect(linhas);if(d.map.nome<0)return;const C=colS();colabRaw=linhas;const m=(C.map&&C.map.nome>=0)?C.map:d.map;

function colAplicarSil(linhas,map,hi){const C=colS();const manuais=C.lista.filter(c=>c.manual);const out=[];const vis=new Set();linhas.slice(hi+1).forEach(L=>{const nome=String((L||[])[map.nome]??'').trim();const cod=map.cod>=0?String((L||[])[map.cod]??'').trim():'';if(!nome)return;const k=colNorm(cod)+'|'+colNorm(nome);if(vis.has(k))return;vis.add(k);out.push({cod,nome});});manuais.forEach(m=>{if(!out.some(o=>colNorm(o.nome)===colNorm(m.nome)))out.push(m);});if(!out.length)return;C.lista=out;C.map=map;C.em=new Date().toLocaleString('pt-BR');touch();if(tab==='handheld'){const ae=document.activeElement;if(!ae||ae===document.body||ae.id==='hhdScan')render();}}
async function colPuxar(){const F=colS().fonte;const url=`https://docs.google.com/spreadsheets/d/${F.id}/gviz/tq?tqx=out:csv&gid=${F.gid}`;
  toast('⏳ Buscando a lista na planilha…');

    const linhas=gLerCsv(t)[0].linhas.filter(L=>L&&L.some(x=>String(x).trim()));if(!linhas.length)throw new Error('vazio');colMapear(linhas);}
  catch(e){console.warn(e);modal(`<h3 style="margin:0 0 8px">Não consegui puxar da planilha</h3><div class="note" style="margin:0 0 10px">Para o app ler sozinho, a planilha precisa estar compartilhada como <b>"Qualquer pessoa com o link → Leitor"</b> (Compartilhar → Acesso geral). No link do Claude essa busca não funciona — use o link do GitHub.<br><br>Outra opção: no Google Sheets, <b>Arquivo → Fazer download → .xlsx ou .csv</b> e use <b>📄 Importar arquivo</b>.</div><div class="row" style="justify-content:flex-end"><button class="btn gold" data-close>Entendi</button></div>`);}}
async function colImportar(file){try{const nome=file.name||'';let abas=/\.(xlsx|xlsm)$/i.test(nome)?await gLerXlsx(await file.arrayBuffer()):gLerCsv(await file.text());
  abas=abas.filter(a=>a.linhas.length);if(!abas.length){toast('Arquivo vazio.');return;}
  let best=abas[0],bs=-1;abas.forEach(a=>{const d=colDetect(a.linhas);const sc=(d.map.nome>=0?2:0)+(d.map.cod>=0?1:0);if(sc>bs){bs=sc;best=a;}});
  colMapear(best.linhas.filter(L=>L&&L.some(x=>String(x).trim())));}catch(e){console.warn(e);toast('Não consegui ler esse arquivo. Use .xlsx ou .csv.');}}

async function sha256hex(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
function senhaOk(){return Date.now()<senhaAte;}
function pedirSenha(motivo,cb){if(senhaOk()){cb();return;}senhaPend=cb;
  modal(`<h3 style="margin:0 0 6px">🔒 Senha necessária</h3><div class="note" style="margin:0 0 10px">Para ${esc(motivo)}, digite a senha.</div>
   <input id="senhaIn" type="password" inputmode="numeric" autocomplete="off" style="width:100%;font-size:22px;font-weight:800;text-align:center;letter-spacing:6px;padding:10px;border-radius:10px">
   <div id="senhaMsg" class="neg" style="min-height:20px;margin-top:6px;font-size:13px"></div>
   <div class="row" style="gap:8px;justify-content:flex-end;margin-top:6px"><button class="btn light" data-close>Cancelar</button><button class="btn gold" id="senhaOkBtn">Confirmar</button></div>`);
  setTimeout(()=>{const i=$('#senhaIn');if(i)i.focus();},40);}
async function senhaConferir(){const i=$('#senhaIn');if(!i)return;const h=await sha256hex(i.value.trim());
  if(h===SENHA_HASH){const cb=senhaPend;senhaPend=null;const c=document.querySelector('#modalBox [data-close]');if(c)c.click();setTimeout(()=>{senhaAte=Date.now()+2000;try{if(cb)cb();}finally{senhaAte=0;}},30);toast('🔓 Senha correta.');}
  else{const m=$('#senhaMsg');if(m)m.textContent='Senha incorreta.';i.value='';i.focus();}}
document.addEventListener('click',e=>{if(e.target.closest('#senhaOkBtn')){senhaConferir();}});
window.addEventListener('keydown',e=>{if(e.target&&e.target.id==='senhaIn'&&e.key==='Enter'){e.preventDefault();e.stopPropagation();senhaConferir();}},true);
const SENHA_ACTS={'hhd-add':'cadastrar handheld','hhd-lote':'cadastrar handhelds','hhd-addnc':'cadastrar handhelds','hhd-addcolab':'adicionar colaborador','col-add':'adicionar colaborador','col-puxar':'atualizar a lista de colaboradores','col-colunas':'mudar as colunas da lista','hhf-del':'excluir registros do histórico'};

  else if(del&&del.dataset.hhfdel!=null){motivo='excluir este registro do histórico';const sel=`[data-hhfdel="${del.dataset.hhfdel}"]`;refazer=()=>{const x=document.querySelector(sel);if(x)x.click();};}

/* ---- leitura do código de barras: leitor (teclado), sem foco e câmera ---- */
let hhdKT=[],hhdBuf='',hhdBufT=0,hhdAutoT=null;
function hhdSubmit(el){clearTimeout(hhdAutoT);const v=(el?el.value:'').trim();if(!v)return;
  if(el.id==='hhdQuem'){hhdS().quem=v;touch();const ch=document.querySelector('.hhdcol');if(ch)ch.innerHTML=hhdChip();const sc=$('#hhdScan');if(sc)sc.focus();}
  else{el.value='';hhdBipar(v);}}
window.addEventListener('keydown',e=>{const t=e.target;if(tab!=='handheld')return;
  const isEnter=e.key==='Enter'||e.keyCode===13||e.which===13;
  if(t&&(t.id==='hhdScan'||t.id==='hhdQuem')){
    if(isEnter||(e.key==='Tab'&&t.value.trim()&&t.id==='hhdScan')){e.preventDefault();e.stopPropagation();hhdSubmit(t);return;}
    hhdKT.push(performance.now());if(hhdKT.length>40)hhdKT.shift();return;}
  // leitor bipando sem nenhum campo selecionado
  const ae=document.activeElement;if(ae&&ae!==document.body&&ae.tagName!=='BUTTON')return;if($('#modal').classList.contains('on'))return;
  const now=performance.now();if(now-hhdBufT>120)hhdBuf='';hhdBufT=now;
  if(isEnter){if(hhdBuf.length>=3){e.preventDefault();const v=hhdBuf;hhdBuf='';hhdBipar(v);}return;}
  if(e.key&&e.key.length===1){hhdBuf+=e.key;}
},true);
document.addEventListener('input',e=>{const t=e.target;if(!t||(t.id!=='hhdScan'&&t.id!=='hhdQuem'))return;
  // leitor sem Enter: se os caracteres chegaram muito rápido, envia sozinho após uma pausa
  clearTimeout(hhdAutoT);const L=hhdKT.slice(-Math.max(3,t.value.length));
  const rapido=L.length>=3&&(L[L.length-1]-L[0])/(L.length-1)<45;
  if(rapido&&t.value.trim().length>=3)hhdAutoT=setTimeout(()=>{if(document.activeElement===t)hhdSubmit(t);},180);});
let camStream=null,camLoop=null,camAlvo='hhdScan';
async function camParar(){if(camLoop){clearTimeout(camLoop);camLoop=null;}if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;}if(window._zxCtl){try{window._zxCtl.stop();}catch(e){}window._zxCtl=null;}}
async function camAbrir(alvo){camAlvo=alvo||'hhdScan';
  modal(`<h3 style="margin:0 0 8px">📷 Ler código pela câmera</h3><div class="note" style="margin:0 0 8px">Aponte para o código de barras do ${camAlvo==='hhdQuem'?'crachá':'handheld'}.</div><video id="camV" playsinline muted style="width:100%;max-height:60vh;background:#000;border-radius:10px"></video><div id="camMsg" class="note" style="margin-top:6px"></div><div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn light" data-act="cam-fechar">Fechar</button></div>`);
  const msg=t=>{const m=$('#camMsg');if(m)m.innerHTML=t;};
  const achou=v=>{camParar();const ov=document.querySelector('#modal');if(ov)ov.classList.remove('on');const el=$('#'+camAlvo);if(el){el.value=v;if(camAlvo==='hhdQuem'){hhdS().quem=v;touch();render();const sc=$('#hhdScan');if(sc)sc.focus();}else hhdBipar(v);}};
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('sem câmera');
    if('BarcodeDetector' in window){
      camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=$('#camV');v.srcObject=camStream;await v.play();
      const det=new BarcodeDetector({formats:['code_128','code_39','code_93','ean_13','ean_8','upc_a','upc_e','itf','codabar','qr_code','data_matrix','pdf417']});msg('Procurando código…');
      const tick=async()=>{if(!camStream)return;try{const r=await det.detect(v);if(r&&r.length){achou(r[0].rawValue);return;}}catch(e){}camLoop=setTimeout(tick,180);};tick();
    }else{
      msg('Carregando leitor…');
      if(!window.ZXingBrowser){await new Promise((ok,er)=>{const s=document.createElement('script');s.src='https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js';s.onload=ok;s.onerror=er;document.head.appendChild(s);});}
      const rd=new ZXingBrowser.BrowserMultiFormatReader();msg('Procurando código…');
      window._zxCtl=await rd.decodeFromVideoDevice(undefined,'camV',(res)=>{if(res)achou(res.getText());});
    }
  }catch(e){console.warn(e);msg('<span class="neg">Não consegui abrir a câmera aqui. Permita o acesso à câmera no navegador (ou use o link do GitHub) — ou use o leitor/digite o código.</span>');}
}
document.addEventListener('click',e=>{const c=e.target.closest('[data-cam]');if(c){camAbrir(c.dataset.cam);return;}
  const t=e.target.closest('[data-act="cam-fechar"],[data-close]');if(t&&camStream!==null||t&&window._zxCtl){camParar();}
  if(e.target.closest('[data-act="cam-fechar"]')){camParar();$('#modal').classList.remove('on');}});

function hhdS(){if(!S.hhd)S.hhd={cad:[],mov:[],quem:'',modo:'auto'};if(!S.hhd.cad)S.hhd.cad=[];if(!S.hhd.mov)S.hhd.mov=[];return S.hhd;}

function hhdNome(cod){const c=hhdS().cad.find(x=>hhdNorm(x.cod)===hhdNorm(cod));return c?c.nome:'';}
function hhdStatus(){const st={};hhdS().mov.forEach(m=>{st[hhdNorm(m.cod)]=m;});return st;}

function hhdMin(a){const d=new Date();const [h,m]=String(a||'').split(':').map(Number);if(isNaN(h))return null;let x=(d.getHours()*60+d.getMinutes())-(h*60+m);if(x<0)x+=1440;return x;}
function hhdBipar(cod){
  const H=hhdS();cod=hhdNorm(cod);if(!cod)return;
  const last=hhdStatus()[cod];const emUso=last&&last.tipo==='saida';

  if(tipo==='entrada'&&!emUso){toast('⚠ '+cod+' não estava em uso — registrado como devolução mesmo assim.');}
  if(tipo==='saida'&&emUso){toast('⚠ '+cod+' já estava em uso com '+(last.quem||'—')+' — registrada nova retirada.');}
  let quem,qcod;if(tipo==='saida'){const col=colAchar(H.quem);quem=col?col.nome:(H.quem||'').trim();qcod=col?col.cod:'';}else{quem=(last&&last.quem)||'';qcod=(last&&last.qcod)||'';}
  hhdHist();const mv={id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),data:hhdDataISO(),cod,tipo,hora:hhdAgora(),quem,qcod,cad:!!hhdNome(cod)};H.mov.push(mv);S.hhdHist.push({...mv});
  if(!hhdNome(cod))toast('ℹ '+cod+' não está cadastrado — dá para cadastrar na lista abaixo.');
  else if(!(tipo==='entrada'&&!emUso)&&!(tipo==='saida'&&emUso))toast((tipo==='saida'?'📤 Retirado: ':'📥 Devolvido: ')+cod+(hhdNome(cod)?' · '+hhdNome(cod):'')+(quem?' · '+quem:''));

  touch();render();
}

  const css=document.getElementById('app-css').textContent,js=document.getElementById('app-js').textContent;
  const body=document.body.cloneNode(false);
  return '<!DOCTYPE html>\n<html lang="pt-BR">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>Labor x Produtividade — Operação Meli</title>\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">\n<style id="app-css">'+css+'</style>\n</head>\n<body>\n'+SHELL+'\n<script type="application/json" id="app-state">'+st+'</'+'script>\n<script id="app-js">'+js+'</'+'script>\n</body>\n</html>';
}
const SHELL=(()=>{const parts=[];for(const n of document.body.children){if(n.tagName==='SCRIPT')break;const c=n.cloneNode(true);if(c.id==='app'||c.id==='nav')c.innerHTML='';c.querySelectorAll&&c.querySelectorAll('#app,#nav,#status').forEach(x=>x.innerHTML='');parts.push(c.outerHTML);}return parts.join('\n');})();
async function save(){
  if(!artifact){try{localStorage.setItem(LS,JSON.stringify(Object.assign({},S,{_savedAt:Date.now()})));}catch(e){}dirty=false;S._savedAt=Date.now();setStatus();toast('Salvo neste navegador. (Para salvar na nuvem, abra pelo link do Claude.)');return;}
  $('#btnSave').disabled=true;toast('Salvando…');
  try{S._savedAt=Date.now();await artifact.publish(buildDoc());dirty=false;try{localStorage.removeItem(LS);}catch(e){}toast('✓ Salvo! Todos que abrirem o link verão estes dados.');}
  catch(err){const c=(err&&(err.code||err.name))||'';toast(c==='conflict'?'Outra pessoa salvou antes — a página foi atualizada.':(c==='not_granted'||c==='not_writer')?'Você só tem permissão de leitura.':'Não deu para salvar agora. Tente de novo.');}
  finally{$('#btnSave').disabled=false;setStatus();}
}
function csvCiclo(){
  const c=S.cicloSel,R=calcCiclo(c),L=[];const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  L.push(['Ciclo '+c].map(q).join(';'));
  L.push(['Faixa','Etq Início','Etq Fim','Dur','Bancadas','Pessoas','Produção Etq','Acum Etq','Pesca Início','Pesca Fim','Ilhas','Produção Pesca','Acum Pesca','Sort Início','Sort Fim','HC','Produção Sorting','Acum Sorting','N-SACA Pesca','N-SACA Sorting','HC total'].map(q).join(';'));
  R.rows.forEach((r,i)=>{const g=S.grid[c][i];L.push([i+1,g.etq[0],g.etq[1],r.dE.toFixed(2).replace('.',','),r.banc,r.pessoas,r.pE,r.aE,g.pesca[0],g.pesca[1],r.ilhas,r.pP,r.aP,g.sort[0],g.sort[1],r.hc,r.pS,r.aS,r.nP,r.nS,r.total].map(q).join(';'));});
  L.push(['Totais','','','','','',R.tE,'','','','',R.tP,'','','','',R.tS,'',R.tNP,R.tNS,''].map(q).join(';'));
  L.push(['TOTAL SORTING (N-SACA incluso)',R.tSort,'N-SACA dentro',Math.min(R.tNS,R.tSort)].map(q).join(';'));
  return '﻿'+L.join('\r\n');
}
function modal(html){$('#modalBox').innerHTML=html;$('#modal').classList.add('on');}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'||e.target.dataset.close!=null)$('#modal').classList.remove('on');});
async function exportCSV(){
  const data=csvCiclo(),fn=`ciclo_${S.cicloSel}_${new Date().toISOString().slice(0,10)}.csv`;
  if(downloads){try{await downloads.save({filename:fn,data});toast('Arquivo pronto: '+fn);return;}catch(e){}}
  modal(`<h2>CSV do ciclo ${S.cicloSel}</h2><p class="note">Copie e cole no Excel ou no Google Sheets.</p><textarea readonly>${esc(data.slice(1))}</textarea><div class="row" style="margin-top:10px;gap:8px"><button class="btn gold" id="cp">Copiar</button><button class="btn light" data-close>Fechar</button></div>`);
  $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(data.slice(1));toast('Copiado!');}catch(e){toast('Selecione o texto e copie com Ctrl+C.');}};
}
function backup(){
  const data=JSON.stringify(S);
  modal(`<h2>Backup dos dados</h2><p class="note">Copie o texto para guardar, ou cole um backup e clique em Restaurar.</p><textarea id="bk">${esc(data)}</textarea><div class="row" style="margin-top:10px;gap:8px"><button class="btn gold" id="cp">Copiar</button>${downloads?'<button class="btn light" id="dl">Baixar .json</button>':''}<button class="btn light" id="rs">Restaurar</button><button class="btn light" data-close>Fechar</button></div>`);
  $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText($('#bk').value);toast('Copiado!');}catch(e){toast('Selecione o texto e copie com Ctrl+C.');}};
  if($('#dl'))$('#dl').onclick=async()=>{try{await downloads.save({filename:'backup_labor_produtividade.json',data:$('#bk').value});}catch(e){}};
  $('#rs').onclick=()=>{try{const o=JSON.parse($('#bk').value);if(!o.grid||!o.prod)throw 0;S=o;touch();render();$('#modal').classList.remove('on');toast('Backup restaurado — clique em Salvar.');}catch(e){toast('Backup inválido.');}};
}
$('#btnSave').onclick=save;$('#btnExport').onclick=exportCSV;$('#btnBackup').onclick=backup;
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});

if(S.expedicao&&S.expedicao.length&&!S.expedicao[0][0]&&S.expedicao[1]&&S.expedicao[1][0]==='YMS')S.expedicao.shift();
function hojeStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function zerarPessoas(){
  CICLOS.forEach(c=>{(S.grid[c]||[]).forEach(r=>{r.banc=null;r.ilhas=null;r.hc=null;r.nsIlhas=null;r.nsHc=null;r.chBanc=null;r.chIlhas=null;r.chHc=null;r.outros=r.outros.map(()=>null);});
    if(S.hcReal)S.hcReal[c]=(S.grid[c]||[]).map(()=>null);
    if(S.ajuste&&S.ajuste[c])S.ajuste[c]={buffered:null,etqBranca:null};});
  (S.expedicao||[]).forEach(r=>r[2]=null);
  if(S.hhd){hhdHist();S.hhd.mov=[];}
  S.realizado={};S.ctlRec={};S.hcHora={};S.banc={};if(S.hh)Object.values(S.hh).forEach(o=>Object.values(o).forEach(L=>L.forEach(r=>r.real=null)));
  if(S.pdPend)S.pdPend={buffered:null,etqBranca:null};
}
if(S.dia!==hojeStr()){const primeira=!S.dia;zerarPessoas();S.dia=hojeStr();setTimeout(()=>{touch();toast('📅 Novo dia ('+new Date().toLocaleDateString('pt-BR')+') — pessoas zeradas em todos os ciclos. Preencha e clique em Salvar.');},300);}
function temaAtual(){try{const t=localStorage.getItem('kn-labor-tema');if(t)return t;}catch(e){}return S.tema||'claro';}
function temaCls(){return temaAtual()==='escuro'?'hhwrap':'mlwrap';}
function aplicarTema(){const d=temaAtual()==='escuro';document.body.classList.toggle('dark',d);const b=$('#btnTema');if(b)b.textContent=d?'☀️ Claro':'🌙 Escuro';}
$('#btnTema').onclick=()=>{const n=temaAtual()==='escuro'?'claro':'escuro';try{localStorage.setItem('kn-labor-tema',n);}catch(e){}S.tema=n;aplicarTema();render();};
aplicarTema();
$('#btnZerar').onclick=()=>{modal(`<h2>Zerar pessoas?</h2><p class="note">Bancadas, Ilhas, HC, outros setores, N-SACA, HC Real, Expedição e Buffered/ETQ Branca de <b>todos os ciclos</b> ficam em branco. Horários, volumes e produtividade continuam.</p><div class="row" style="gap:8px;margin-top:10px"><button class="btn gold" id="zOk">Zerar</button><button class="btn light" data-close>Cancelar</button></div>`);$('#zOk').onclick=()=>{zerarPessoas();touch();render();$('#modal').classList.remove('on');toast('Pessoas zeradas.');};};
render();
if(window.claude&&claude.use){claude.use('artifact').then(a=>{artifact=a;setStatus();}).catch(()=>{});claude.use('downloads').then(d=>{downloads=d;}).catch(()=>{});}
})();
</script>
</body>
</html>
